<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz 26 Cumpleaños Treyci!</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 1s ease-in-out;
        }

        body.theme-0 {
            background: linear-gradient(135deg, #ff007f, #7928ca, #4facfe);
        }
        body.theme-1 {
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #fda085);
        }
        body.theme-2 {
            background: linear-gradient(135deg, #13547a, #80d0c7, #1a2a6c);
        }
        body.theme-3 {
            background: linear-gradient(135deg, #f12711, #f5af19, #e65c00);
        }

        .particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: float 6s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0.5; }
            50% { transform: translateY(-30px) translateX(20px); opacity: 1; }
        }

        .page-flip {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 50%, #ffffff 100%);
            z-index: 10;
            border-radius: 25px;
            opacity: 0;
            animation: flipPage 0.9s ease-in-out forwards;
            pointer-events: none;
            box-shadow: 0 15px 30px rgba(0,0,0,0.12);
        }

        @keyframes flipPage {
            0% {
                transform: translateX(100%) rotateY(0deg) scaleX(0.8);
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            50% {
                transform: translateX(0) rotateY(0deg) scaleX(1);
                opacity: 1;
            }
            100% {
                transform: translateX(-100%) rotateY(0deg) scaleX(0.8);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            padding: 2.5rem;
            max-width: 800px;
            z-index: 2;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), 0 0 30px rgba(255, 255, 255, 0.2);
            animation: cardEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 30%, rgba(255, 255, 255, 0.1) 50%, transparent 70%);
            animation: shine 3.5s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        @keyframes cardEntrance {
            0% { transform: scale(0.8) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        .page-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: bounce 2s infinite, rotate 3s infinite linear;
            display: inline-block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes rotate {
            0% { transform: rotateZ(0deg); }
            100% { transform: rotateZ(360deg); }
        }

        .badge {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #1a2a6c;
            padding: 8px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 -2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            margin-bottom: 15px;
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 -2px 5px rgba(0,0,0,0.1); }
            50% { transform: scale(1.05); box-shadow: 0 6px 20px rgba(0,0,0,0.3), inset 0 -2px 5px rgba(0,0,0,0.1); }
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(3rem, 7vw, 5.5rem);
            color: #ffffff;
            text-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.3);
            margin-bottom: 25px;
            line-height: 1.1;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 20px rgba(255,255,255,0.3); }
            50% { text-shadow: 0 4px 10px rgba(0,0,0,0.4), 0 0 40px rgba(255,255,255,0.5); }
        }

        .photo-frame {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            border: 6px solid #ffffff;
            box-shadow: 0 0 40px rgba(255,255,255,0.8), inset 0 0 20px rgba(0,0,0,0.2);
            overflow: hidden;
            margin: 0 auto 30px auto;
            background: rgba(255,255,255,0.2);
            position: relative;
            animation: photoFloat 3s ease-in-out infinite;
        }

        @keyframes photoFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
        }

        .photo-frame::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shimmer 3s infinite;
            z-index: 10;
            pointer-events: none;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .photo-frame:hover img {
            transform: scale(1.05);
        }

        .dynamic-phrase {
            font-size: clamp(1.1rem, 2.5vw, 1.4rem);
            font-weight: 600;
            color: #ffffff;
            min-height: 60px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5), 0 0 10px rgba(255,255,255,0.2);
            letter-spacing: 0.5px;
            padding: 0 10px;
            animation: phraseSlide 0.6s ease-in-out;
            line-height: 1.5;
        }

        @keyframes phraseSlide {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .pagination-dots {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.5);
        }

        .dot.active {
            background: #ffffff;
            transform: scale(1.4);
            box-shadow: 0 0 15px #ffffff, 0 0 30px rgba(255,255,255,0.6);
            border-color: rgba(255,255,255,0.8);
        }

        .dot:hover {
            background: rgba(255,255,255,0.7);
            transform: scale(1.2);
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #ffcc00;
            pointer-events: none;
            z-index: 1;
            animation: confettiFall 3s ease-in forwards;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotateZ(720deg);
                opacity: 0;
            }
        }

        .corner-decoration {
            position: absolute;
            font-size: 2rem;
            opacity: 0.3;
            animation: float 4s infinite ease-in-out;
        }

        .corner-tl { top: 10px; left: 10px; animation-delay: 0s; }
        .corner-tr { top: 10px; right: 10px; animation-delay: 1s; }
        .corner-bl { bottom: 10px; left: 10px; animation-delay: 2s; }
        .corner-br { bottom: 10px; right: 10px; animation-delay: 3s; }

        .music-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #ffffff;
            font-size: 12px;
            opacity: 0.7;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .music-icon {
            font-size: 18px;
            animation: musicPulse 0.6s ease-in-out infinite;
        }

        @keyframes musicPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @media (max-width: 768px) {
            .container {
                margin: 20px;
                padding: 1.5rem;
            }

            h1 {
                font-size: 2.5rem;
                margin-bottom: 15px;
            }

            .photo-frame {
                width: 200px;
                height: 200px;
            }

            .page-icon {
                font-size: 3rem;
            }

            .music-indicator {
                font-size: 10px;
            }
        }
    </style>
</head>
<body class="theme-0" id="mainBody">

    <div class="particles-bg" id="particlesBg"></div>

    <div class="container" id="cardContainer">
        <div class="corner-decoration corner-tl">🎉</div>
        <div class="corner-decoration corner-tr">✨</div>
        <div class="corner-decoration corner-bl">🎂</div>
        <div class="corner-decoration corner-br">🌟</div>

        <div class="page-icon" id="pageIcon">🌈</div>
        <div class="badge" id="pageBadge">✨ 8 de Octubre • ¡Felices 26! ✨</div>
        <h1>¡Feliz Cumpleaños, Treyci!</h1>

        <div class="photo-frame">
            <img id="mainPhoto" src="" alt="Treyci">
        </div>

        <div class="dynamic-phrase" id="dynamicPhrase">Cargando momentos mágicos...</div>

        <div class="pagination-dots" id="dotsContainer"></div>

        <div class="music-indicator">
            <span class="music-icon">🎵</span>
            <span id="songName">Canción de Cumpleaños</span>
        </div>
    </div>

    <audio id="birthdayAudio" autoplay loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/02/15/audio_d1584910db.mp3" type="audio/mpeg">
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const pagesData = [
            {
                photo: "1691838455126.jpg",
                theme: "theme-0",
                icon: "🌈",
                badge: "✨ Arcoíris de Alegría • 26 Años ✨",
                phrase: "¡Que tu vida se llene de todos los colores del arcoíris, éxito y felicidad infinita!"
            },
            {
                photo: "IMG_20240331_165722.jpg",
                theme: "theme-1",
                icon: "🌸",
                badge: "🌸 Estilo y Primavera 🌸",
                phrase: "Que florezcan hermosas oportunidades para ti en este nuevo año de vida."
            },
            {
                photo: "IMG-20240307-WA0016.jpg",
                theme: "theme-2",
                icon: "✨",
                badge: "✨ Chispas de Magia ✨",
                phrase: "Brillas con luz propia en cada paso que das. ¡Disfruta muchísimo tu día!"
            },
            {
                photo: "1691842838401.jpg",
                theme: "theme-3",
                icon: "🎂",
                badge: "🎂 Gran Celebración • 8 de Octubre 🎂",
                phrase: "¡A celebrar a lo grande tus 26 añitos rodeada de todo el cariño que te mereces!"
            },
            {
                photo: "1691842837759.jpg",
                theme: "theme-0",
                icon: "🌟",
                badge: "🌟 Momentos Inolvidables 🌟",
                phrase: "Cada recuerdo juntos es un tesoro. ¡Muchas felicidades hoy y siempre!"
            },
            {
                photo: "IMG_20230523_193459.jpg",
                theme: "theme-1",
                icon: "🌷",
                badge: "🌷 Bella Primavera 🌷",
                phrase: "Que la alegría y la paz inunden tu corazón en este día tan especial."
            },
            {
                photo: "IMG-20240228-WA0000.jpg",
                theme: "theme-2",
                icon: "💫",
                badge: "💫 Éxitos y Metas 💫",
                phrase: "Que todas tus metas y grandes sueños se sigan haciendo realidad."
            },
            {
                photo: "IMG-20240225-WA0008.jpg",
                theme: "theme-3",
                icon: "🎉",
                badge: "🎉 ¡Feliz Cumpleaños! 🎉",
                phrase: "¡Pásala increíble! Que tengas un cumpleaños maravilloso de principio a fin."
            }
        ];

        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/jcckirito/feliz-ano-nuevo/main/";

        function resolveAssetUrl(filename) {
            if (!filename) return "";
            if (/^https?:\/\//i.test(filename)) return filename;
            return `${GITHUB_RAW_BASE}${filename}`;
        }

        function createParticles() {
            const particlesBg = document.getElementById("particlesBg");
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement("div");
                particle.classList.add("particle");
                particle.style.left = Math.random() * 100 + "%";
                particle.style.top = Math.random() * 100 + "%";
                particle.style.animationDelay = Math.random() * 2 + "s";
                particle.style.animationDuration = (Math.random() * 4 + 6) + "s";
                particlesBg.appendChild(particle);
            }
        }

        function createConfetti() {
            const colors = ['#ffcc00', '#ff6b9d', '#4facfe', '#00f2fe', '#ffd700'];
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement("div");
                confetti.classList.add("confetti");
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.top = "-10px";
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2.5) + "s";
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3500);
            }
        }

        function createPageFlip() {
            const flip = document.createElement("div");
            flip.classList.add("page-flip");
            return flip;
        }

        let currentPage = 0;
        const mainBody = document.getElementById("mainBody");
        const cardContainer = document.getElementById("cardContainer");
        const pageIcon = document.getElementById("pageIcon");
        const pageBadge = document.getElementById("pageBadge");
        const mainPhoto = document.getElementById("mainPhoto");
        const dynamicPhrase = document.getElementById("dynamicPhrase");
        const dotsContainer = document.getElementById("dotsContainer");

        pagesData.forEach((_, index) => {
            const dot = document.createElement("div");
            dot.classList.add("dot");
            if (index === 0) dot.classList.add("active");
            dot.addEventListener("click", () => goToPage(index));
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll(".dot");

        function updateSlide() {
            const flip = createPageFlip();
            cardContainer.appendChild(flip);

            setTimeout(() => {
                const data = pagesData[currentPage];
                mainBody.className = data.theme;
                pageIcon.textContent = data.icon;
                pageBadge.textContent = data.badge;
                dynamicPhrase.textContent = data.phrase;

                const imageUrl = resolveAssetUrl(data.photo);
                mainPhoto.src = imageUrl;
                mainPhoto.alt = "Treyci";
                mainPhoto.onerror = () => {
                    mainPhoto.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'%3E%3Crect width='300' height='300' fill='%23e7e7e7'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-size='24' fill='%23999'%3EImagen no disponible%3C/text%3E%3C/svg%3E";
                };

                dots.forEach((dot, idx) => {
                    dot.classList.toggle("active", idx === currentPage);
                });

                flip.remove();

                if (currentPage % 3 === 0) {
                    createConfetti();
                }

                currentPage = (currentPage + 1) % pagesData.length;
            }, 900);
        }

        function goToPage(index) {
            currentPage = index;
            updateSlide();
        }

        createParticles();
        updateSlide();
        setInterval(updateSlide, 5000);

        window.addEventListener('click', () => {
            const audio = document.getElementById("birthdayAudio");
            if (audio) {
                audio.play().catch(() => {});
            }
        }, { once: true });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                updateSlide();
            } else if (e.key === 'ArrowLeft') {
                currentPage = (currentPage - 2 + pagesData.length) % pagesData.length;
                updateSlide();
            }
        });
    </script>
</body>
</html>
