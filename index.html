<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cuenta regresiva - Año Nuevo</title>
  <style>
    :root{
      --text: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.72);
      --stroke: rgba(255,255,255,.16);
      --night1:#050611;
      --night2:#071232;
      --day1:#79c7ff;
      --day2:#b7f0ff;
      --grass1:#1fd27a;
      --grass2:#0aa85a;
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      overflow:hidden;
      background: var(--night1);
    }

    .layer{ position:fixed; inset:0; pointer-events:none; }
    .bgNight{
      background:
        radial-gradient(1200px 700px at 15% 15%, rgba(34,211,238,.22), transparent 60%),
        radial-gradient(1000px 700px at 85% 25%, rgba(236,72,153,.20), transparent 60%),
        radial-gradient(1200px 800px at 50% 95%, rgba(124,58,237,.22), transparent 60%),
        linear-gradient(180deg, var(--night1), var(--night2) 55%, #040617);
      transition: opacity 1.2s ease;
      opacity: 1;
    }
    .bgDay{
      background:
        radial-gradient(900px 600px at 70% 20%, rgba(255,224,138,.85), transparent 55%),
        radial-gradient(700px 450px at 20% 25%, rgba(255,255,255,.65), transparent 55%),
        linear-gradient(180deg, var(--day1), var(--day2) 60%, #eafff8);
      opacity:0;
      transition: opacity 1.6s ease;
    }

    .aurora{
      inset:-40%;
      background:
        radial-gradient(closest-side at 30% 30%, rgba(34,211,238,.35), transparent 62%),
        radial-gradient(closest-side at 70% 35%, rgba(236,72,153,.25), transparent 62%),
        radial-gradient(closest-side at 50% 70%, rgba(124,58,237,.30), transparent 65%);
      filter: blur(26px);
      opacity:.85;
      animation: floatAurora 12s ease-in-out infinite alternate;
      mix-blend-mode: screen;
      transition: opacity 1.2s ease;
    }
    @keyframes floatAurora{
      from{ transform: translate3d(-2%, -1%, 0) scale(1.02) rotate(-2deg); }
      to  { transform: translate3d( 2%,  1%, 0) scale(1.08) rotate( 2deg); }
    }

    .stars, .stars:before, .stars:after{
      position:fixed; inset:-220px; content:"";
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 120px 120px;
      opacity:.18;
      animation: drift 42s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.12));
    }
    .stars:before{ background-size: 160px 160px; opacity:.12; animation-duration: 62s; }
    .stars:after { background-size: 90px  90px;  opacity:.09; animation-duration: 86s; }
    @keyframes drift{ from{ transform: translateY(0);} to{ transform: translateY(240px);} }

    .wrap{
      position:relative;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding: 18px;
      z-index: 5;
      pointer-events:auto;
    }
    .card{
      width:min(820px, 100%);
      border-radius: 28px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      box-shadow: 0 30px 90px rgba(0,0,0,.50);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(12px);
      transition: transform 1.2s ease, background 1.2s ease;
    }
    .card::before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(900px 450px at 30% 0%, rgba(34,211,238,.28), transparent 60%),
        radial-gradient(900px 450px at 70% 0%, rgba(236,72,153,.22), transparent 60%),
        radial-gradient(900px 500px at 50% 110%, rgba(124,58,237,.25), transparent 60%);
      filter: blur(18px);
      opacity:.9;
      pointer-events:none;
      transition: opacity 1.2s ease;
    }
    .content{
      position:relative;
      padding: 24px 16px 16px;
      text-align:center;
      z-index: 3;
    }
    .pill{
      display:inline-flex; gap:10px; align-items:center;
      padding: 10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      font-size: 13px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(34,211,238,.95);
      box-shadow: 0 0 18px rgba(34,211,238,.55);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform:scale(1); opacity:.9; }
      50%{ transform:scale(1.25); opacity:1; }
    }

    h1{
      margin: 14px 0 10px;
      font-size: clamp(34px, 7.5vw, 60px);
      line-height: 1.05;
      text-shadow: 0 0 28px rgba(124,58,237,.45);
      transition: transform 1.0s ease, text-shadow 1.0s ease;
    }
    .year{
      display:inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      font-weight: 900;
    }
    .subtitle{
      margin: 0 auto 14px;
      max-width: 65ch;
      color: var(--muted);
      font-size: clamp(15px, 4vw, 18px);
      transition: opacity 1s ease, transform 1s ease;
    }

    .count{
      display:grid;
      gap: 10px;
      grid-template-columns: repeat(4, minmax(0,1fr));
      margin: 14px 0 12px;
    }
    .box{
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 12px 10px;
      backdrop-filter: blur(12px);
      transform: translateZ(0);
    }
    .num{
      font-size: clamp(30px, 9vw, 46px);
      font-weight: 900;
      letter-spacing: .5px;
    }
    .lbl{
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.68);
    }

    .actions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 10px;
    }
    button{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    button:active{ transform: scale(.98); }

    .footer{
      padding: 0 16px 16px;
      text-align:center;
      font-size: 12.5px;
      color: rgba(255,255,255,.60);
      position:relative;
      z-index:2;
    }
    @media (max-width: 420px){
      .count{ grid-template-columns: repeat(2, minmax(0,1fr)); }
      .content{ padding: 22px 14px 14px; }
    }

    canvas#fx, canvas#streaks, canvas#rain {
      position:absolute; inset:0;
      width:100%; height:100%;
      pointer-events:none;
    }
    canvas#streaks{ z-index: 2; }
    canvas#fx{ z-index: 4; }
    canvas#rain{ z-index: 6; opacity:0; transition: opacity .8s ease; }

    .dragonWrap{
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      z-index: 2;
      pointer-events:none;
      opacity:.98;
    }
    .dragonOrbit{
      width:min(560px, 96vw);
      aspect-ratio: 1 / 1;
      position:relative;
      animation: orbit 8s linear infinite;
      filter: drop-shadow(0 0 22px rgba(34,211,238,.18));
    }
    @keyframes orbit { from { transform: rotate(0deg);} to{ transform: rotate(360deg);} }

    .dragon{
      position:absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%) translateY(-46%) rotate(16deg);
      width: 170px;
      opacity:.96;
      animation: dragonBob 1.6s ease-in-out infinite;
    }
    @keyframes dragonBob{
      0%,100%{ transform: translate(-50%,-50%) translateY(-46%) rotate(10deg) scale(1); }
      50%{ transform: translate(-50%,-50%) translateY(-46%) rotate(22deg) scale(1.03); }
    }
    .dragon .body{ fill: rgba(255,255,255,.86); }
    .dragon .detail{ fill: rgba(255,255,255,.55); }
    .dragon .eye{ fill: rgba(34,211,238,.95); }

    .bells{
      position:absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      display:flex;
      gap:10px;
      opacity:0;
      transform: translateY(-8px);
      transition: opacity .8s ease, transform .8s ease;
      pointer-events:none;
    }
    .bell{
      width: 28px; height: 28px;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.30));
      animation: bell 0.7s ease-in-out infinite;
      transform-origin: top center;
    }
    .bell:nth-child(2){ animation-delay: .12s; }
    .bell:nth-child(3){ animation-delay: .24s; }
    @keyframes bell{
      0%,100%{ transform: rotate(-12deg); }
      50%{ transform: rotate(12deg); }
    }

    .ground{
      position:absolute; left:0; right:0; bottom:0;
      height: 34vh;
      z-index: 7;
      pointer-events:none;
    }
    .grass{
      position:absolute; left:-10%; right:-10%; bottom:-2px;
      height: 34vh;
      background:
        radial-gradient(900px 200px at 50% 100%, rgba(0,0,0,.35), transparent 70%),
        linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.15)),
        linear-gradient(180deg, rgba(31,210,122,0.0), rgba(31,210,122,.12));
      opacity:0;
      transition: opacity 1.2s ease;
    }
    .blades{
      position:absolute; left:0; right:0; bottom:0;
      height: 26vh;
      transform-origin: bottom center;
      transform: scaleY(0.05);
      opacity:0;
      transition: transform 2.2s cubic-bezier(.2,.9,.2,1), opacity 1.2s ease;
    }
    .blade{
      position:absolute;
      bottom:0;
      width: 10px;
      height: 80px;
      border-radius: 999px 999px 8px 8px;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 25%),
                  linear-gradient(180deg, var(--grass1), var(--grass2));
      opacity:.9;
      filter: drop-shadow(0 8px 20px rgba(0,0,0,.20));
      transform-origin: bottom center;
      animation: sway 2.4s ease-in-out infinite;
    }
    @keyframes sway{
      0%,100%{ transform: rotate(-4deg); }
      50%{ transform: rotate(4deg); }
    }

    .animals{
      position:absolute; inset:0;
      z-index: 9;
      pointer-events:none;
      opacity:0;
      transition: opacity 1.2s ease;
    }
    .animal{
      position:absolute;
      bottom: 10vh;
      width: 120px;
      opacity:.92;
      filter: drop-shadow(0 18px 30px rgba(0,0,0,.25));
      transform: translateX(var(--from)) scale(0.85);
      transition: transform 2.0s cubic-bezier(.2,.9,.2,1);
    }
    .animal path{ fill: rgba(0,0,0,.55); }
    .animal.bunny{ left: 6vw; --from: -30vw; }
    .animal.bird{ right: 6vw; --from: 30vw; width: 110px; bottom: 12vh; }

    .speech{
      position:absolute;
      left:50%;
      bottom: 22vh;
      transform: translateX(-50%) translateY(10px);
      padding: 12px 14px;
      border-radius: 16px;
      border:1px solid rgba(0,0,0,.12);
      background: rgba(255,255,255,.72);
      color: rgba(0,0,0,.75);
      font-weight: 900;
      font-size: 14px;
      opacity:0;
      transition: opacity 1.1s ease, transform 1.1s ease;
      max-width: min(320px, 88vw);
      text-align:center;
    }

    body.midnight .bgNight{ opacity:0; }
    body.midnight .aurora{ opacity:0.08; }
    body.midnight .bgDay{ opacity:1; }

    body.midnight .card{
      background: linear-gradient(180deg, rgba(255,255,255,.60), rgba(255,255,255,.30));
      transform: translateY(-2px);
    }
    body.midnight .card::before{ opacity:0.25; }
    body.midnight h1{ text-shadow: 0 0 24px rgba(255,224,138,.55); }
    body.midnight .subtitle{ color: rgba(0,0,0,.62); }
    body.midnight .pill{
      background: rgba(255,255,255,.55);
      color: rgba(0,0,0,.65);
      border-color: rgba(0,0,0,.10);
    }
    body.midnight .box{
      background: rgba(255,255,255,.55);
      border-color: rgba(0,0,0,.10);
      color: rgba(0,0,0,.75);
    }
    body.midnight .lbl{ color: rgba(0,0,0,.55); }

    body.midnight canvas#rain{ opacity:1; }
    body.midnight .bells{ opacity:1; transform: translateY(0); }
    body.midnight .grass{ opacity:1; }
    body.midnight .blades{ opacity:1; transform: scaleY(1); }
    body.midnight .animals{ opacity:1; }
    body.midnight .animal{ transform: translateX(0) scale(1); }
    body.midnight .speech{ opacity:1; transform: translateX(-50%) translateY(0); }

    body.midnight .dragonWrap{ opacity:0; transition: opacity .8s ease; }
  </style>
</head>

<body>
  <div class="layer bgNight"></div>
  <div class="layer bgDay"></div>
  <div class="layer aurora"></div>
  <div class="layer stars"></div>

  <div class="wrap">
    <div class="card">
      <canvas id="streaks"></canvas>
      <canvas id="fx"></canvas>
      <canvas id="rain"></canvas>

      <div class="dragonWrap" aria-hidden="true">
        <div class="dragonOrbit">
          <svg class="dragon" viewBox="0 0 256 256" aria-hidden="true">
            <path class="body" d="M205 66c-18-18-44-20-66-8-6-10-18-18-32-18-18 0-33 12-36 28-18 5-31 22-31 41 0 19 12 36 30 42 2 20 19 36 40 36h7c-6 10-16 17-29 19 23 7 49 0 66-18 20 14 46 18 70 10-11-3-20-9-26-17h6c26 0 47-20 47-46 0-20-13-37-33-43 4-13 1-28-13-42z"/>
            <path class="detail" d="M84 76l10-10 8 12-10 10-8-12zm26-18l12-7 4 13-12 7-4-13zm35-3l13 2-6 12-13-2 6-12zm33 10l10 9-11 8-10-9 11-8z"/>
            <path class="detail" d="M190 96c18 0 28 10 34 18-14-8-26-9-40-4 10-10 6-14 6-14zm-8 16c-12 12-26 18-44 18 16 6 34 5 50-4-2 8-8 14-18 18 22-2 32-18 30-32-6 2-12 2-18 0z"/>
            <circle class="eye" cx="188" cy="92" r="5"/>
            <path class="detail" d="M52 142c-10 10-9 22-2 30-2-10 4-18 14-22-7-3-9-5-12-8z"/>
          </svg>
        </div>
      </div>

      <div class="bells" aria-hidden="true">
        <svg class="bell" viewBox="0 0 64 64">
          <path fill="#f2c94c" d="M32 6c-7 0-12 6-12 13v7c0 5-2 8-5 11-2 2-3 4-3 6h40c0-2-1-4-3-6-3-3-5-6-5-11v-7C44 12 39 6 32 6z"/>
          <circle cx="32" cy="50" r="6" fill="#c27c0e"/>
        </svg>
        <svg class="bell" viewBox="0 0 64 64">
          <path fill="#f2c94c" d="M32 6c-7 0-12 6-12 13v7c0 5-2 8-5 11-2 2-3 4-3 6h40c0-2-1-4-3-6-3-3-5-6-5-11v-7C44 12 39 6 32 6z"/>
          <circle cx="32" cy="50" r="6" fill="#c27c0e"/>
        </svg>
        <svg class="bell" viewBox="0 0 64 64">
          <path fill="#f2c94c" d="M32 6c-7 0-12 6-12 13v7c0 5-2 8-5 11-2 2-3 4-3 6h40c0-2-1-4-3-6-3-3-5-6-5-11v-7C44 12 39 6 32 6z"/>
          <circle cx="32" cy="50" r="6" fill="#c27c0e"/>
        </svg>
      </div>

      <div class="content">
        <div class="pill"><span class="dot"></span><span id="status">Cuenta regresiva para medianoche…</span></div>

        <h1 id="title">
          ¡Falta poco para <span class="year" id="yearTxt"></span>! ✨
        </h1>

        <div class="subtitle" id="msg">
          Prepárate… se viene un nuevo año lleno de oportunidades. 💫
        </div>

        <div class="count" aria-label="Contador">
          <div class="box"><div class="num" id="d">00</div><div class="lbl">Días</div></div>
          <div class="box"><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
          <div class="box"><div class="num" id="m">00</div><div class="lbl">Min</div></div>
          <div class="box"><div class="num" id="s">00</div><div class="lbl">Seg</div></div>
        </div>

        <div class="actions">
          <button id="btnFullscreen">Pantalla completa ⛶</button>
        </div>
      </div>

      <div class="footer">Zona horaria usada: <b>America/Lima</b> (Perú)</div>

      <div class="ground" aria-hidden="true">
        <div class="grass"></div>
        <div class="blades" id="blades"></div>

        <div class="animals">
          <svg class="animal bunny" viewBox="0 0 128 96">
            <path d="M36 58c-6-10-6-25 2-36 5-7 10-10 14-10 6 0 8 6 6 14 6-8 12-12 18-10 8 2 10 16 6 26 12 6 20 16 20 28 0 18-14 30-34 30H54c-20 0-34-12-34-30 0-6 4-10 16-12z"/>
          </svg>
          <svg class="animal bird" viewBox="0 0 128 96">
            <path d="M18 62c20-2 34-10 46-24 10-12 18-20 30-20 12 0 20 10 16 22-3 8-10 14-20 18 10 2 16 8 16 16 0 14-14 22-34 22-20 0-38-10-54-34z"/>
          </svg>

          <div class="speech" id="speech">Por un nuevo año mejor 🌟</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PARA = "";
    const MENSAJE_ANO_NUEVO =
      "Que este nuevo año te traiga mucha salud, trabajo, dinero, paz y prosperidad. " +
      "Que todo lo bueno se multiplique, que los sueños se cumplan y que nunca falte la alegría. ✨";
    const FIRMA = "";
    const timeZone = "America/Lima";

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    // ===== AUDIO (cascabeles) =====
    let audioEnabled = false;
    let audioCtx = null;

    function ensureAudio() {
      if (audioEnabled) return true;
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume?.();
        audioEnabled = true;
        return true;
      } catch {
        return false;
      }
    }

    function bellDing(time, freq) {
      if (!audioEnabled || !audioCtx) return;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = "sine";
      o.frequency.setValueAtTime(freq, time);
      o.frequency.exponentialRampToValueAtTime(freq * 1.6, time + 0.04);

      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(0.35, time + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.35);

      o.connect(g);
      g.connect(audioCtx.destination);

      o.start(time);
      o.stop(time + 0.38);
    }

    function playBellsSequence() {
      if (!ensureAudio()) return;
      const t0 = audioCtx.currentTime + 0.02;
      bellDing(t0, 880);
      bellDing(t0 + 0.14, 988);
      bellDing(t0 + 0.28, 784);
      bellDing(t0 + 0.42, 1046);
    }

    // ===== HORA PERÚ =====
    function nowInTZ() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone,
        year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).formatToParts(new Date());
      const get = (t) => parts.find(p => p.type === t).value;
      const y = +get("year"), mo = +get("month"), da = +get("day");
      const hh = +get("hour"), mm = +get("minute"), ss = +get("second");
      return new Date(y, mo-1, da, hh, mm, ss);
    }
    function nextMidnight() {
      const n = nowInTZ();
      const t = new Date(n);
      t.setDate(t.getDate() + 1);
      t.setHours(0,0,0,0);
      return t;
    }

    // ===== PASTO =====
    function buildGrass() {
      const blades = $("blades");
      blades.innerHTML = "";
      const width = window.innerWidth;
      const count = Math.max(42, Math.floor(width / 10));
      for (let i=0;i<count;i++){
        const b = document.createElement("div");
        b.className = "blade";
        const x = (i / count) * 100;
        const h = 40 + Math.random()*75;
        const w = 6 + Math.random()*10;
        const delay = Math.random()*0.8;
        b.style.left = `calc(${x}% - ${w/2}px)`;
        b.style.height = `${h}px`;
        b.style.width = `${w}px`;
        b.style.animationDelay = `${delay}s`;
        b.style.opacity = `${0.70 + Math.random()*0.25}`;
        blades.appendChild(b);
      }
    }
    buildGrass();
    window.addEventListener("resize", buildGrass);

    // ===== CANVAS =====
    function fitCanvas(c){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = c.getBoundingClientRect();
      c.width = Math.floor(rect.width * dpr);
      c.height = Math.floor(rect.height * dpr);
      const ctx = c.getContext("2d");
      ctx.setTransform(dpr,0,0,dpr,0,0);
      return ctx;
    }

    // ===== FIUUU =====
    const streakCanvas = document.getElementById("streaks");
    let sctx = null;
    let streaks = [];

    function spawnStreak(){
      const rect = streakCanvas.getBoundingClientRect();
      const x = Math.random()*rect.width;
      const y = rect.height + 40;
      streaks.push({
        x, y,
        vx: (-0.5 + Math.random()*1.0) * 0.6,
        vy: -(10 + Math.random()*16),
        len: 24 + Math.random()*36,
        life: 18 + Math.random()*14
      });
    }

    function drawStreaks(){
      const rect = streakCanvas.getBoundingClientRect();
      sctx.clearRect(0,0,rect.width,rect.height);

      if (!document.body.classList.contains("midnight")) {
        if (Math.random() < 0.24) spawnStreak();
      }

      for (const p of streaks){
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 1;

        const a = Math.max(0, p.life/30);
        sctx.beginPath();
        sctx.strokeStyle = `rgba(255,255,255,${0.58*a})`;
        sctx.lineWidth = 2;
        sctx.moveTo(p.x, p.y);
        sctx.lineTo(p.x - p.vx*p.len, p.y - p.vy*p.len);
        sctx.stroke();
      }
      streaks = streaks.filter(p => p.life > 0 && p.y > -100);

      requestAnimationFrame(drawStreaks);
    }

    // ===== CONFETTI =====
    const fxCanvas = document.getElementById("fx");
    let fctx = null;
    let confetti = [];
    let confettiOn = false;

    function burstConfetti(count=340){
      const rect = fxCanvas.getBoundingClientRect();
      confetti = Array.from({length: count}, () => ({
        x: Math.random()*rect.width,
        y: rect.height + 40 + Math.random()*80,
        vx: -2.6 + Math.random()*5.2,
        vy: -(4 + Math.random()*8),
        g: 0.14 + Math.random()*0.09,
        r: 3 + Math.random()*7,
        a: Math.random()*Math.PI*2,
        va: -0.22 + Math.random()*0.44,
        life: 260 + Math.random()*220
      }));
      confettiOn = true;
    }

    function drawConfetti(){
      const rect = fxCanvas.getBoundingClientRect();
      fctx.clearRect(0,0,rect.width,rect.height);

      if (confettiOn){
        for (const p of confetti){
          p.vy += p.g;
          p.x += p.vx;
          p.y += p.vy;
          p.a += p.va;
          p.life -= 1;

          const hue = (p.x/rect.width)*360;
          fctx.save();
          fctx.translate(p.x, p.y);
          fctx.rotate(p.a);
          fctx.fillStyle = `hsla(${hue}, 95%, 70%, 0.96)`;
          fctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
          fctx.restore();
        }
        confetti = confetti.filter(p => p.life > 0 && p.y < rect.height + 90);
        if (confetti.length === 0) confettiOn = false;
      }
      requestAnimationFrame(drawConfetti);
    }

    // ===== LLUVIA =====
    const rainCanvas = document.getElementById("rain");
    let rctx = null;
    let drops = [];
    let rainOn = false;

    function startRain(seconds=6){
      const rect = rainCanvas.getBoundingClientRect();
      drops = Array.from({length: 190}, () => ({
        x: Math.random()*rect.width,
        y: Math.random()*rect.height,
        vy: 10 + Math.random()*18,
        len: 10 + Math.random()*16
      }));
      rainOn = true;
      setTimeout(() => rainOn = false, seconds*1000);
    }

    function drawRain(){
      const rect = rainCanvas.getBoundingClientRect();
      rctx.clearRect(0,0,rect.width,rect.height);

      if (rainOn){
        rctx.strokeStyle = "rgba(0,0,0,.18)";
        rctx.lineWidth = 1.5;
        for (const d of drops){
          d.y += d.vy;
          if (d.y > rect.height + 30){
            d.y = -20;
            d.x = Math.random()*rect.width;
          }
          rctx.beginPath();
          rctx.moveTo(d.x, d.y);
          rctx.lineTo(d.x, d.y + d.len);
          rctx.stroke();
        }
      }
      requestAnimationFrame(drawRain);
    }

    // ===== TEXTO =====
    function setHeader(){
      const y = nowInTZ().getFullYear() + 1;
      $("yearTxt").textContent = y;
    }

    function showMidnight(){
      const y = nowInTZ().getFullYear();
      document.title = `¡Feliz Año Nuevo ${y}!`;

      $("status").textContent = "¡Ya es medianoche! 🎉";
      $("title").innerHTML = `¡Feliz Año Nuevo <span class="year">${y}</span>! 🌞`;
      $("msg").innerHTML =
        (PARA ? `<b>${PARA}</b><br><br>` : "") +
        MENSAJE_ANO_NUEVO +
        `<br><br><b>Por un nuevo año mejor</b> 🌟` +
        (FIRMA ? `<br><br><b>${FIRMA}</b>` : "");

      document.body.classList.add("midnight");

      playBellsSequence();
      startRain(6);
      burstConfetti(380);

      if (navigator.vibrate) navigator.vibrate([120,60,120]);

      setTimeout(playBellsSequence, 900);
      setTimeout(playBellsSequence, 1800);
    }

    // ===== COUNTDOWN =====
    let done = false;
    function tick(){
      const n = nowInTZ();
      const t = nextMidnight();
      const diff = t - n;

      if (diff <= 0){
        if (!done){
          done = true;
          $("d").textContent = "00";
          $("h").textContent = "00";
          $("m").textContent = "00";
          $("s").textContent = "00";
          showMidnight();
        }
        return;
      }

      const totalSec = Math.floor(diff/1000);
      const days = Math.floor(totalSec/86400);
      const hours = Math.floor((totalSec%86400)/3600);
      const mins  = Math.floor((totalSec%3600)/60);
      const secs  = totalSec%60;

      $("d").textContent = pad2(days);
      $("h").textContent = pad2(hours);
      $("m").textContent = pad2(mins);
      $("s").textContent = pad2(secs);
    }

    // ===== BOTÓN ÚNICO =====
    document.getElementById("btnFullscreen").addEventListener("click", async () => {
      ensureAudio(); // habilita audio con gesto
      try{
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      }catch(e){}
    });

    // 1 toque en cualquier parte habilita audio
    window.addEventListener("pointerdown", () => { ensureAudio(); }, { once:true });

    // ===== INIT =====
    function init(){
      sctx = fitCanvas(streakCanvas);
      fctx = fitCanvas(fxCanvas);
      rctx = fitCanvas(rainCanvas);

      window.addEventListener("resize", () => {
        sctx = fitCanvas(streakCanvas);
        fctx = fitCanvas(fxCanvas);
        rctx = fitCanvas(rainCanvas);
      });

      setHeader();
      tick();
      setInterval(tick, 250);

      drawStreaks();
      drawConfetti();
      drawRain();
    }
    init();
  </script>
</body>
</html>
