<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Feliz Año Nuevo 2026</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background: radial-gradient(circle at top, #1e3a8a, #020617 70%);
      color: white;
      overflow: hidden;
    }

    .scene {
      min-height: 100vh;
      display: grid;
      place-items: center;
      position: relative;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(40px, 9vw, 80px);
      margin: 0;
      text-shadow: 0 0 25px rgba(255,255,255,.4);
    }

    .year {
      color: #fde68a;
    }

    .message {
      max-width: 600px;
      margin-top: 20px;
      font-size: clamp(16px, 4vw, 20px);
      color: #e5e7eb;
    }

    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 28px;
      padding: 40px 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
      position: relative;
      z-index: 2;
    }

    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 14px 18px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      color: white;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }

    canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    /* Dragón decorativo */
    .dragon {
      position: absolute;
      width: 200px;
      opacity: .9;
      animation: orbit 12s linear infinite;
    }

    @keyframes orbit {
      from { transform: rotate(0deg) translateX(180px) rotate(0deg); }
      to { transform: rotate(360deg) translateX(180px) rotate(-360deg); }
    }

    /* Cascabeles */
    .bells {
      position: fixed;
      top: 20px;
      right: 20px;
      font-size: 26px;
      animation: bell 0.7s infinite alternate;
    }

    @keyframes bell {
      from { transform: rotate(-10deg); }
      to { transform: rotate(10deg); }
    }

    /* Pasto */
    .grass {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 25vh;
      background: linear-gradient(#16a34a, #065f46);
      clip-path: polygon(0 100%, 0 60%, 100% 40%, 100% 100%);
    }

    .animals {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 32px;
    }
  </style>
</head>

<body>

<canvas id="confetti"></canvas>
<canvas id="rain"></canvas>

<div class="bells">🔔🔔</div>

<div class="scene">
  <div class="card">
    <h1>🎉 Feliz Año Nuevo <span class="year">2026</span> 🎉</h1>

    <p class="message">
      Que este nuevo año llegue cargado de salud, trabajo, prosperidad y paz.
      <br><br>
      Que tus metas se cumplan, que nunca falte alegría
      y que cada día sea mejor que el anterior.
      <br><br>
      <strong>Por un nuevo año mejor ✨</strong>
    </p>

    <div class="actions">
      <button onclick="startRain()">Dar click para llover 🌧️</button>
    </div>
  </div>

  <!-- Dragón simple -->
  <svg class="dragon" viewBox="0 0 100 100">
    <path d="M50 5 C70 20, 80 40, 70 60 C60 80, 40 80, 30 60 C20 40, 30 20, 50 5 Z"
          fill="rgba(255,255,255,.8)" />
  </svg>
</div>

<div class="animals">🐇 🐦</div>
<div class="grass"></div>

<script>
  // ===== CONFETTI =====
  const c = document.getElementById("confetti");
  const ctx = c.getContext("2d");
  function resize() {
    c.width = innerWidth;
    c.height = innerHeight;
  }
  resize();
  window.onresize = resize;

  let confetti = Array.from({length: 200}, () => ({
    x: Math.random() * c.width,
    y: Math.random() * c.height,
    r: Math.random() * 6 + 2,
    vy: Math.random() * 3 + 2,
    hue: Math.random() * 360
  }));

  function drawConfetti() {
    ctx.clearRect(0,0,c.width,c.height);
    confetti.forEach(p => {
      p.y += p.vy;
      if (p.y > c.height) p.y = -10;
      ctx.fillStyle = `hsl(${p.hue},100%,70%)`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    });
    requestAnimationFrame(drawConfetti);
  }
  drawConfetti();

  // ===== LLUVIA =====
  const r = document.getElementById("rain");
  const rctx = r.getContext("2d");
  r.width = innerWidth;
  r.height = innerHeight;

  let raining = false;
  let drops = [];

  function startRain() {
    raining = true;
    drops = Array.from({length: 150}, () => ({
      x: Math.random() * r.width,
      y: Math.random() * r.height,
      vy: Math.random() * 10 + 10
    }));
    setTimeout(() => raining = false, 5000);
  }

  function drawRain() {
    rctx.clearRect(0,0,r.width,r.height);
    if (raining) {
      rctx.strokeStyle = "rgba(255,255,255,.3)";
      rctx.lineWidth = 1;
      drops.forEach(d => {
        d.y += d.vy;
        if (d.y > r.height) d.y = -20;
        rctx.beginPath();
        rctx.moveTo(d.x, d.y);
        rctx.lineTo(d.x, d.y + 15);
        rctx.stroke();
      });
    }
    requestAnimationFrame(drawRain);
  }
  drawRain();
</script>

</body>
</html>
