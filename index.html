<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feliz Año Nuevo 2026</title>

<style>
body{
  margin:0;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background: radial-gradient(circle at top, #1e40af, #020617 70%);
  color:white;
  overflow:hidden;
}

.scene{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  text-align:center;
  position:relative;
}

.card{
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);
  border-radius:32px;
  padding:42px 28px;
  backdrop-filter: blur(14px);
  box-shadow:0 40px 90px rgba(0,0,0,.6);
  max-width:680px;
  z-index:3;
}

h1{
  font-size:clamp(42px,9vw,86px);
  margin:0;
  text-shadow:0 0 35px rgba(255,255,255,.45);
}

.year{
  color:#fde68a;
}

.message{
  margin-top:22px;
  font-size:clamp(16px,4.2vw,21px);
  line-height:1.55;
  color:#e5e7eb;
}

strong{
  color:#fff;
}

.actions{
  margin-top:28px;
}

button{
  padding:14px 22px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#38bdf8,#a855f7);
  color:white;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 10px 35px rgba(0,0,0,.45);
}

canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
}

/* Dragón */
.dragon{
  position:absolute;
  width:220px;
  opacity:.85;
  animation: orbit 14s linear infinite;
  z-index:2;
}

@keyframes orbit{
  from{ transform:rotate(0deg) translateX(210px) rotate(0deg);}
  to{ transform:rotate(360deg) translateX(210px) rotate(-360deg);}
}

/* Cascabeles */
.bells{
  position:fixed;
  top:18px;
  right:18px;
  font-size:28px;
  animation:bell .8s ease-in-out infinite alternate;
}

@keyframes bell{
  from{ transform:rotate(-12deg);}
  to{ transform:rotate(12deg);}
}

/* Pasto */
.grass{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:26vh;
  background:linear-gradient(#22c55e,#065f46);
  clip-path:polygon(0 100%,0 58%,100% 40%,100% 100%);
}

/* Animalitos */
.animals{
  position:fixed;
  bottom:70px;
  left:50%;
  transform:translateX(-50%);
  font-size:36px;
  opacity:.95;
}
</style>
</head>

<body>

<canvas id="confetti"></canvas>
<canvas id="rain"></canvas>

<div class="bells">🔔 🔔</div>

<div class="scene">
  <div class="card">
    <h1>🎉 Feliz Año Nuevo <span class="year">2026</span> 🎉</h1>

    <p class="message">
      Que este nuevo año llegue cargado de <strong>salud</strong>,
      <strong>trabajo</strong>, <strong>prosperidad</strong> y <strong>paz</strong>.
      <br><br>
      Que los sueños se cumplan, que nunca falte la esperanza
      y que cada día sea una nueva oportunidad para sonreír.
      <br><br>
      <strong>Por un nuevo año mejor ✨</strong>
    </p>

    <div class="actions">
      <button onclick="startRain()">Dar click para llover 🌧️</button>
    </div>
  </div>

  <!-- Dragón -->
  <svg class="dragon" viewBox="0 0 100 100">
    <path d="M50 5 C72 22,82 42,72 62 C62 82,38 82,28 62 C18 42,28 22,50 5 Z"
          fill="rgba(255,255,255,.85)"/>
  </svg>
</div>

<div class="animals">🐇 🐦</div>
<div class="grass"></div>

<script>
/* CONFETTI */
const c=document.getElementById("confetti"),ctx=c.getContext("2d");
function resize(){c.width=innerWidth;c.height=innerHeight}
resize();addEventListener("resize",resize);

let confetti=[...Array(220)].map(()=>({
  x:Math.random()*c.width,
  y:Math.random()*c.height,
  r:Math.random()*6+2,
  vy:Math.random()*3+2,
  hue:Math.random()*360
}));

function drawConfetti(){
  ctx.clearRect(0,0,c.width,c.height);
  confetti.forEach(p=>{
    p.y+=p.vy;
    if(p.y>c.height)p.y=-10;
    ctx.fillStyle=`hsl(${p.hue},100%,70%)`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  });
  requestAnimationFrame(drawConfetti);
}
drawConfetti();

/* LLUVIA */
const r=document.getElementById("rain"),rctx=r.getContext("2d");
r.width=innerWidth;r.height=innerHeight;
let raining=false,drops=[];

function startRain(){
  raining=true;
  drops=[...Array(160)].map(()=>({
    x:Math.random()*r.width,
    y:Math.random()*r.height,
    vy:Math.random()*12+10
  }));
  setTimeout(()=>raining=false,5000);
}

function drawRain(){
  rctx.clearRect(0,0,r.width,r.height);
  if(raining){
    rctx.strokeStyle="rgba(255,255,255,.35)";
    rctx.lineWidth=1.3;
    drops.forEach(d=>{
      d.y+=d.vy;
      if(d.y>r.height)d.y=-20;
      rctx.beginPath();
      rctx.moveTo(d.x,d.y);
      rctx.lineTo(d.x,d.y+18);
      rctx.stroke();
    });
  }
  requestAnimationFrame(drawRain);
}
drawRain();
</script>

</body>
</html>
