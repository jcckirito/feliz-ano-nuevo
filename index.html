<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FODEPICO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:#f2f4f8;
}

.header{
  background:linear-gradient(135deg,#00ff66,#00cc55);
  padding:25px;
  text-align:center;
  color:#0b3d1f;
  font-size:30px;
  font-weight:800;
  letter-spacing:2px;
}

.card{
  background:#fff;
  margin:20px;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

label{
  font-size:18px;
  font-weight:600;
}

input{
  width:100%;
  padding:16px;
  font-size:20px;
  margin-top:8px;
  margin-bottom:15px;
  border-radius:12px;
  border:2px solid #e0e0e0;
}

.total{
  background:linear-gradient(135deg,#1f7a3a,#2ecc71);
  color:white;
  text-align:center;
  padding:22px;
  border-radius:16px;
  font-size:26px;
  font-weight:700;
}

button{
  width:90%;
  margin:10px auto;
  display:block;
  padding:18px;
  font-size:20px;
  font-weight:700;
  border:none;
  border-radius:16px;
  background:#0b3d1f;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
  font-size:16px;
}

th, td{
  padding:10px;
  border-bottom:1px solid #ccc;
  text-align:center;
}

th{
  background:#00cc55;
  color:#0b3d1f;
}
</style>
</head>

<body>

<div class="header">FODEPICO</div>

<div class="card">
  <label>Nombre de la pieza</label>
  <input type="text" id="pieza" placeholder="Ej: Costado">

  <label>Ancho (mm)</label>
  <input type="number" id="ancho">

  <label>Largo (mm)</label>
  <input type="number" id="largo">

  <div class="total">
    Tot.p2<br>
    <span id="total">0.00</span>
  </div>
</div>

<button onclick="agregar()">➕ Agregar pieza</button>

<div class="card">
  <h3>Piezas agregadas</h3>
  <table>
    <thead>
      <tr>
        <th>Pieza</th>
        <th>Ancho (mm)</th>
        <th>Largo (mm)</th>
        <th>Tot.p2</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
</div>

<script>
let piezas = [];

function calcular(){
  let ancho = anchoInput.value;
  let largo = largoInput.value;

  if(ancho>0 && largo>0){
    let tot = ((ancho/25)*(largo/25))/144;
    total.innerText = tot.toFixed(2);
  }else{
    total.innerText = "0.00";
  }
}

const anchoInput = document.getElementById("ancho");
const largoInput = document.getElementById("largo");
const total = document.getElementById("total");
const lista = document.getElementById("lista");

anchoInput.addEventListener("input", calcular);
largoInput.addEventListener("input", calcular);

function agregar(){
  let nombre = document.getElementById("pieza").value;
  let ancho = anchoInput.value;
  let largo = largoInput.value;
  let tot = total.innerText;

  if(!nombre || !ancho || !largo){
    alert("Completa todos los datos");
    return;
  }

  piezas.push({nombre, ancho, largo, tot});

  let fila = `
    <tr>
      <td>${nombre}</td>
      <td>${ancho}</td>
      <td>${largo}</td>
      <td>${tot}</td>
    </tr>`;
  lista.innerHTML += fila;

  document.getElementById("pieza").value="";
  anchoInput.value="";
  largoInput.value="";
  total.innerText="0.00";
}
</script>

</body>
</html>
