<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FODEPICO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: 'Segoe UI', Arial, sans-serif;
  background:#f2f4f8;
}

/* Header */
.header{
  background:linear-gradient(135deg,#00ff66,#00cc55);
  padding:25px;
  text-align:center;
  color:#0b3d1f;
  font-size:30px;
  font-weight:800;
  letter-spacing:2px;
}

/* Subtitulo */
.subtitle{
  text-align:center;
  margin-top:5px;
  font-size:14px;
  color:#1f7a3a;
}

/* Card */
.card{
  background:#ffffff;
  margin:20px;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

/* Labels */
label{
  font-size:18px;
  font-weight:600;
  color:#333;
}

/* Inputs */
input{
  width:100%;
  padding:16px;
  font-size:22px;
  margin-top:8px;
  margin-bottom:20px;
  border-radius:12px;
  border:2px solid #e0e0e0;
}

/* Total */
.total{
  background:linear-gradient(135deg,#1f7a3a,#2ecc71);
  color:white;
  text-align:center;
  padding:25px;
  border-radius:16px;
  font-size:28px;
  font-weight:700;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

/* Botón */
button{
  width:90%;
  margin:20px auto;
  display:block;
  padding:18px;
  font-size:22px;
  font-weight:700;
  border:none;
  border-radius:16px;
  background:#0b3d1f;
  color:white;
  box-shadow:0 8px 18px rgba(0,0,0,0.2);
}

button:active{
  transform:scale(0.97);
}
</style>
</head>

<body>

<div class="header">FODEPICO</div>
<div class="subtitle">Cálculo de área en p²</div>

<div class="card">
  <label>Ancho (mm)</label>
  <input type="number" id="ancho" placeholder="Ej: 500">

  <label>Largo (mm)</label>
  <input type="number" id="largo" placeholder="Ej: 1000">

  <div class="total">
    Tot.p2<br>
    <span id="total">0.00</span>
  </div>
</div>

<button>➕ Agregar pieza</button>

<script>
function calcular(){
  let ancho = document.getElementById("ancho").value;
  let largo = document.getElementById("largo").value;

  if(ancho>0 && largo>0){
    let anchoP = ancho / 25;
    let largoP = largo / 25;
    let tot = (anchoP * largoP) / 144;
    document.getElementById("total").innerText = tot.toFixed(2);
  }else{
    document.getElementById("total").innerText = "0.00";
  }
}

document.getElementById("ancho").addEventListener("input", calcular);
document.getElementById("largo").addEventListener("input", calcular);
</script>

</body>
</html>
