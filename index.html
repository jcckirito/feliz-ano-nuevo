<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corte Melamina</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  padding: 15px;
}

.card {
  background: #3cff3c;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 10px;
}

h2 {
  text-align: center;
  margin: 0;
}

label {
  font-weight: bold;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 10px;
  font-size: 16px;
}

.total {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
}

button {
  width: 100%;
  padding: 12px;
  font-size: 18px;
  background: #1f7a1f;
  color: white;
  border: none;
  border-radius: 6px;
}
</style>
</head>

<body>

<div class="card">
  <h2>ÁREA</h2>
</div>

<div class="card">
  <label>Ancho (mm)</label>
  <input type="number" id="ancho">

  <label>Largo (mm)</label>
  <input type="number" id="largo">

  <div class="total">
    Tot.p2: <span id="total">0.00</span>
  </div>
</div>

<button>Agregar pieza</button>

</body>
</html>
