<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cuenta regresiva - Año Nuevo</title>
  <style>
    :root{
      --text: rgba(255,255,255,.95);
      --muted: rgba(255,255,255,.72);
      --stroke: rgba(255,255,255,.16);
      --glass: rgba(255,255,255,.10);
    }
    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      overflow:hidden;
      background:#060612;
    }

    /* ===== Fondo animado (auroras + estrellas) ===== */
    .bg{
      position:fixed; inset:0;
      background:
        radial-gradient(1200px 700px at 15% 15%, rgba(34,211,238,.22), transparent 60%),
        radial-gradient(1000px 700px at 85% 25%, rgba(236,72,153,.20), transparent 60%),
        radial-gradient(1200px 800px at 50% 95%, rgba(124,58,237,.22), transparent 60%),
        linear-gradient(180deg, #060612, #071232 55%, #040617);
      pointer-events:none;
    }
    .aurora{
      position:fixed; inset:-40%;
      background:
        radial-gradient(closest-side at 30% 30%, rgba(34,211,238,.35), transparent 62%),
        radial-gradient(closest-side at 70% 35%, rgba(236,72,153,.25), transparent 62%),
        radial-gradient(closest-side at 50% 70%, rgba(124,58,237,.30), transparent 65%);
      filter: blur(26px);
      opacity:.85;
      animation: floatAurora 12s ease-in-out infinite alternate;
      pointer-events:none;
      mix-blend-mode: screen;
    }
    @keyframes floatAurora{
      from{ transform: translate3d(-2%, -1%, 0) scale(1.02) rotate(-2deg); }
      to  { transform: translate3d( 2%,  1%, 0) scale(1.08) rotate( 2deg); }
    }

    .stars, .stars:before, .stars:after{
      position:fixed; inset:-220px;
      content:"";
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 120px 120px;
      opacity:.18;
      animation: drift 42s linear infinite;
      pointer-events:none;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.12));
    }
    .stars:before{ background-size: 160px 160px; opacity:.12; animation-duration: 62s; }
    .stars:after { background-size: 90px  90px;  opacity:.09; animation-duration: 86s; }
    @keyframes drift{ from{ transform: translateY(0);} to{ transform: translateY(240px);} }

    /* ===== Paisaje (montañas) ===== */
    .scene{
      position:fixed; inset:0;
      pointer-events:none;
    }
    .mountains{
      position:absolute; left:0; right:0; bottom:-2px;
      height: 46vh;
      opacity:.95;
      transform: translateZ(0);
    }
    .m1, .m2, .m3{
      position:absolute; left:-10%; right:-10%;
      height:100%;
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(0,0,0,.25));
      filter: drop-shadow(0 16px 40px rgba(0,0,0,.35));
      border-top-left-radius: 40% 55%;
      border-top-right-radius: 45% 60%;
      transform-origin: center bottom;
    }
    .m1{
      bottom:-14%;
      transform: skewX(-8deg) scaleX(1.15);
      opacity:.55;
      background: linear-gradient(180deg, rgba(124,58,237,.22), rgba(0,0,0,.35));
    }
    .m2{
      bottom:-10%;
      transform: skewX(6deg) scaleX(1.12);
      opacity:.70;
      background: linear-gradient(180deg, rgba(34,211,238,.18), rgba(0,0,0,.32));
    }
    .m3{
      bottom:-6%;
      transform: skewX(-2deg) scaleX(1.08);
      opacity:.85;
      background: linear-gradient(180deg, rgba(236,72,153,.16), rgba(0,0,0,.30));
    }

    /* ===== Globos/Luces flotando ===== */
    .floaters{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.75;
    }
    .floater{
      position:absolute;
      width:14px; height:14px;
      border-radius:999px;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.0) 60%),
                  radial-gradient(circle at 50% 50%, rgba(34,211,238,.7), rgba(34,211,238,.0) 70%);
      box-shadow: 0 0 22px rgba(34,211,238,.35);
      animation: rise linear infinite;
      filter: blur(.1px);
    }
    .floater.pink{
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.0) 60%),
                  radial-gradient(circle at 50% 50%, rgba(236,72,153,.7), rgba(236,72,153,.0) 70%);
      box-shadow: 0 0 22px rgba(236,72,153,.30);
    }
    .floater.violet{
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,.0) 60%),
                  radial-gradient(circle at 50% 50%, rgba(124,58,237,.75), rgba(124,58,237,.0) 70%);
      box-shadow: 0 0 22px rgba(124,58,237,.32);
    }
    @keyframes rise{
      from{ transform: translate3d(0, 22vh, 0); opacity: 0; }
      10% { opacity: .9; }
      to  { transform: translate3d(0, -110vh, 0); opacity: 0; }
    }

    /* ===== UI tarjeta ===== */
    .wrap{
      position:relative;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding: 18px;
      z-index:2;
    }
    .card{
      width:min(760px, 100%);
      border-radius: 28px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      box-shadow: 0 30px 90px rgba(0,0,0,.50);
      overflow:hidden;
      position:relative;
      backdrop-filter: blur(12px);
    }
    .card:before{
      content:"";
      position:absolute; inset:-2px;
      background:
        radial-gradient(900px 450px at 30% 0%, rgba(34,211,238,.28), transparent 60%),
        radial-gradient(900px 450px at 70% 0%, rgba(236,72,153,.22), transparent 60%),
        radial-gradient(900px 500px at 50% 110%, rgba(124,58,237,.25), transparent 60%);
      filter: blur(18px);
      opacity:.9;
      pointer-events:none;
    }

    #fx{
      position:absolute; inset:0;
      pointer-events:none;
      z-index:1;
    }

    .content{
      position:relative;
      padding: 24px 16px 16px;
      text-align:center;
      z-index:2;
    }

    .pill{
      display:inline-flex; gap:10px; align-items:center;
      padding: 10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      font-size: 13px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(34,211,238,.95);
      box-shadow: 0 0 18px rgba(34,211,238,.55);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse{
      0%,100%{ transform:scale(1); opacity:.9; }
      50%{ transform:scale(1.25); opacity:1; }
    }

    h1{
      margin: 14px 0 10px;
      font-size: clamp(34px, 7.5vw, 58px);
      line-height: 1.05;
      text-shadow: 0 0 28px rgba(124,58,237,.45);
    }
    .year{
      display:inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      font-weight: 900;
    }

    .subtitle{
      margin: 0 auto 14px;
      max-width: 65ch;
      color: var(--muted);
      font-size: clamp(15px, 4vw, 18px);
    }

    .count{
      display:grid;
      gap: 10px;
      grid-template-columns: repeat(4, minmax(0,1fr));
      margin: 14px 0 12px;
    }
    .box{
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 12px 10px;
      backdrop-filter: blur(12px);
    }
    .num{
      font-size: clamp(30px, 9vw, 44px);
      font-weight: 900;
      letter-spacing: .5px;
    }
    .lbl{
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.68);
    }

    .actions{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top: 10px;
    }
    button{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    button:active{ transform: scale(.98); }
    button.primary{
      background: linear-gradient(90deg, rgba(34,211,238,.22), rgba(236,72,153,.20), rgba(124,58,237,.22));
      border-color: rgba(34,211,238,.35);
    }

    .footer{
      padding: 0 16px 16px;
      text-align:center;
      font-size: 12.5px;
      color: rgba(255,255,255,.60);
      position:relative;
      z-index:2;
    }

    /* Mejor en pantallas pequeñas */
    @media (max-width: 420px){
      .count{ grid-template-columns: repeat(2, minmax(0,1fr)); }
      .content{ padding: 22px 14px 14px; }
    }
  </style>
</head>

<body>
  <div class="bg"></div>
  <div class="aurora"></div>
  <div class="stars"></div>

  <div class="scene">
    <div class="mountains" id="mountains">
      <div class="m1"></div>
      <div class="m2"></div>
      <div class="m3"></div>
    </div>
  </div>

  <div class="floaters" id="floaters"></div>

  <div class="wrap">
    <div class="card">
      <canvas id="fx"></canvas>

      <div class="content">
        <div class="pill"><span class="dot"></span><span id="status">Cuenta regresiva para medianoche…</span></div>

        <h1 id="title">
          ¡Falta poco para <span class="year" id="yearTxt"></span>! ✨
        </h1>

        <div class="subtitle" id="msg">
          Prepárate… se viene un nuevo año lleno de oportunidades. 💫
        </div>

        <div class="count" aria-label="Contador">
          <div class="box"><div class="num" id="d">00</div><div class="lbl">Días</div></div>
          <div class="box"><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
          <div class="box"><div class="num" id="m">00</div><div class="lbl">Min</div></div>
          <div class="box"><div class="num" id="s">00</div><div class="lbl">Seg</div></div>
        </div>

        <div class="actions">
          <button class="primary" id="btnTest">Probar medianoche 🎆</button>
          <button id="btnFullscreen">Pantalla completa ⛶</button>
        </div>
      </div>

      <div class="footer">Zona horaria usada: <b>America/Lima</b> (Perú)</div>
    </div>
  </div>

  <script>
    // ===== PERSONALIZA AQUÍ =====
    const PARA = "";               // Ej: "Para mi familia ❤️"
    const MENSAJE_NOCHE = "Que este nuevo año te traiga mucha salud, trabajo, dinero, paz y prosperidad. Que todo lo bueno se multiplique y que nunca falte la alegría. ¡Vamos con todo! ✨";
    const FIRMA = "";              // Ej: "— Hugo"
    const timeZone = "America/Lima";

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    // ===== Reloj en hora Perú =====
    function nowInTZ() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone,
        year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).formatToParts(new Date());

      const get = (t) => parts.find(p => p.type === t).value;
      const y = +get("year"), mo = +get("month"), da = +get("day");
      const hh = +get("hour"), mm = +get("minute"), ss = +get("second");
      return new Date(y, mo-1, da, hh, mm, ss);
    }
    function nextMidnight() {
      const n = nowInTZ();
      const t = new Date(n);
      t.setDate(t.getDate() + 1);
      t.setHours(0,0,0,0);
      return t;
    }

    // ===== Paisaje con parallax suave =====
    const mountains = $("mountains");
    window.addEventListener("deviceorientation", (e) => {
      // en algunos celulares funciona, en otros no; si no, no pasa nada
      const x = (e.gamma || 0) / 45; // -1 a 1 aprox
      mountains.style.transform = `translate3d(${x * 10}px, 0, 0)`;
    });

    // ===== Luces/Globos flotando =====
    function makeFloaters() {
      const holder = $("floaters");
      holder.innerHTML = "";
      const count = 18;
      for (let i=0;i<count;i++){
        const el = document.createElement("div");
        el.className = "floater";
        const r = Math.random();
        if (r < .33) el.classList.add("pink");
        else if (r < .66) el.classList.add("violet");

        const left = Math.random()*100;
        const size = 10 + Math.random()*10;
        const dur  = 10 + Math.random()*16;
        const delay= Math.random()*8;

        el.style.left = left + "vw";
        el.style.bottom = (-10 - Math.random()*20) + "vh";
        el.style.width = size + "px";
        el.style.height= size + "px";
        el.style.animationDuration = dur + "s";
        el.style.animationDelay = (-delay) + "s";
        holder.appendChild(el);
      }
    }
    makeFloaters();

    // ===== Confetti/Fuegos (canvas) =====
    const canvas = $("fx");
    const ctx = canvas.getContext("2d");
    let W=0, H=0, pieces=[], anim=null;

    function resize() {
      const r = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = Math.floor(r.width);
      H = canvas.height = Math.floor(r.height);
    }
    window.addEventListener("resize", resize);

    function burst(count=320) {
      pieces = Array.from({length: count}, () => ({
        x: Math.random()*W,
        y: H + 40 + Math.random()*80,
        r: 4 + Math.random()*7,
        vy: -(4 + Math.random()*7),
        vx: -2.6 + Math.random()*5.2,
        g: 0.12 + Math.random()*0.08,
        a: Math.random()*Math.PI*2,
        va: -0.22 + Math.random()*0.44,
        life: 260 + Math.random()*220
      }));
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      for (const p of pieces) {
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.a += p.va;
        p.life -= 1;

        const hue = (p.x/W)*360;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        ctx.fillStyle = `hsla(${hue}, 95%, 70%, 0.96)`;
        ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
        ctx.restore();
      }
      pieces = pieces.filter(p => p.life > 0 && p.y < H + 90);
      if (pieces.length > 0) anim = requestAnimationFrame(draw);
    }

    function celebrate(auto=false) {
      cancelAnimationFrame(anim);
      resize();
      burst(360);
      draw();

      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

      if (auto) {
        $("status").textContent = "¡Ya es medianoche! 🎉";
      }
    }

    // ===== Contenido / Texto =====
    function setHeader() {
      const y = nowInTZ().getFullYear() + 1;
      $("yearTxt").textContent = y;
    }

    function showMidnightMessage() {
      const y = nowInTZ().getFullYear(); // ya cambió el año
      document.title = `¡Feliz Año Nuevo ${y}!`;

      $("title").innerHTML = `¡Feliz Año Nuevo <span class="year">${y}</span>! 🎇`;
      $("msg").innerHTML =
        (PARA ? `<b>${PARA}</b><br><br>` : "") +
        MENSAJE_NOCHE +
        (FIRMA ? `<br><br><b>${FIRMA}</b>` : "");
    }

    // ===== Countdown =====
    let already = false;

    function tick() {
      const n = nowInTZ();
      const t = nextMidnight();
      const diff = t - n;

      if (diff <= 0) {
        if (!already) {
          already = true;

          // poner contador en 00
          $("d").textContent = "00";
          $("h").textContent = "00";
          $("m").textContent = "00";
          $("s").textContent = "00";

          // Cambiar texto principal y celebrar
          showMidnightMessage();
          celebrate(true);
        }
        return;
      }

      const totalSec = Math.floor(diff/1000);
      const days = Math.floor(totalSec/86400);
      const hours = Math.floor((totalSec%86400)/3600);
      const mins  = Math.floor((totalSec%3600)/60);
      const secs  = totalSec%60;

      $("d").textContent = pad2(days);
      $("h").textContent = pad2(hours);
      $("m").textContent = pad2(mins);
      $("s").textContent = pad2(secs);
    }

    // ===== Botones =====
    $("btnTest").addEventListener("click", () => {
      // Simula medianoche para probar
      showMidnightMessage();
      celebrate(false);
    });

    $("btnFullscreen").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (e) {}
    });

    // Init
    setHeader();
    resize();
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
