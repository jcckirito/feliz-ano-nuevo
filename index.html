<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>FODEPICO - Corte Melamina</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background:#f2f4f8; }
  .header { background:linear-gradient(135deg,#00ff66,#00cc55); padding:25px; text-align:center; color:#0b3d1f; font-size:30px; font-weight:800; letter-spacing:2px; }
  .card { background:#fff; margin:20px; padding:25px; border-radius:18px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
  label { font-size:18px; font-weight:600; }
  input { width:100%; padding:16px; font-size:18px; margin-top:8px; margin-bottom:15px; border-radius:12px; border:2px solid #e0e0e0; }
  .total { background:linear-gradient(135deg,#1f7a3a,#2ecc71); color:white; text-align:center; padding:22px; border-radius:16px; font-size:26px; font-weight:700; }
  button { width:90%; margin:10px auto; display:block; padding:18px; font-size:20px; font-weight:700; border:none; border-radius:16px; background:#0b3d1f; color:white; cursor:pointer; transition: transform 0.1s ease; }
  button:active { transform:scale(0.97); }
  table { width:100%; border-collapse:collapse; margin-top:15px; font-size:16px; }
  th, td { padding:10px; border-bottom:1px solid #ccc; text-align:center; }
  th { background:#00cc55; color:#0b3d1f; }
  .edit-btn, .delete-btn { cursor: pointer; color: #ff9800; margin-left: 5px; }
  .delete-btn { color: #f44336; }
</style>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
</head>
<body>

<div class="header">FODEPICO</div>

<div class="card">
  <label>Nombre de la pieza</label>
  <input type="text" id="pieza" placeholder="Ej: Costado" />

  <label>Ancho (mm)</label>
  <input type="number" id="ancho" placeholder="Ej: 500" />

  <label>Largo (mm)</label>
  <input type="number" id="largo" placeholder="Ej: 1000" />

  <label>Cantidad</label>
  <input type="number" id="cantidad" placeholder="Ej: 5" />

  <div class="total">Tot.p2<br><span id="total">0.00</span></div>
</div>

<button id="btnAgregar">➕ Agregar pieza</button>
<button id="btnDescargar">⬇ Descargar Excel (.xlsx)</button>
<button id="btnImprimir">🖨 Imprimir datos</button>
<button id="btnBorrarTodo">❌ Borrar todo</button>

<div class="card">
  <h3>Piezas agregadas</h3>
  <table>
    <thead>
      <tr>
        <th>Pieza</th>
        <th>Ancho (mm)</th>
        <th>Ancho (plg)</th>
        <th>Largo (mm)</th>
        <th>Largo (plg)</th>
        <th>Cantidad</th>
        <th>Tot.p2</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="lista"></tbody>
  </table>
</div>

<script>
const piezas = JSON.parse(localStorage.getItem('piezas')) || [];

const piezaInput = document.getElementById('pieza');
const anchoInput = document.getElementById('ancho');
const largoInput = document.getElementById('largo');
const cantidadInput = document.getElementById('cantidad');
const totalDisplay = document.getElementById('total');
const lista = document.getElementById('lista');

function calcular() {
  const ancho = parseFloat(anchoInput.value);
  const largo = parseFloat(largoInput.value);
  if (ancho > 0 && largo > 0) {
    const tot = ((ancho / 25) * (largo / 25)) / 144;
    totalDisplay.innerText = tot.toFixed(2);
  } else {
    totalDisplay.innerText = "0.00";
  }
}
anchoInput.addEventListener("input", calcular);
largoInput.addEventListener("input", calcular);

function renderizar() {
  lista.innerHTML = "";
  piezas.forEach((pieza, index) => {
    const fila = `<tr>
      <td>${pieza.nombre}</td>
      <td>${pieza.ancho}</td>
      <td>${pieza.anchoPlg}</td>
      <td>${pieza.largo}</td>
      <td>${pieza.largoPlg}</td>
      <td>${pieza.cantidad}</td>
      <td>${pieza.tot}</td>
      <td>
        <span class="edit-btn" onclick="editar(${index})">Editar</span>
        <span class="delete-btn" onclick="eliminar(${index})">Eliminar</span>
      </td>
    </tr>`;
    lista.innerHTML += fila;
  });
}

function agregar() {
  const nombre = piezaInput.value.trim();
  const ancho = anchoInput.value.trim();
  const largo = largoInput.value.trim();
  const cantidad = cantidadInput.value.trim();
  const tot = totalDisplay.innerText;

  if (!nombre || !ancho || !largo || !cantidad || tot === "0.00") {
    alert("Por favor completa todos los datos correctamente.");
    return;
  }

  const nombreMayus = nombre.charAt(0).toUpperCase() + nombre.slice(1).toLowerCase();
  const anchoPlg = (ancho / 25.4).toFixed(2);
  const largoPlg = (largo / 25.4).toFixed(2);

  piezas.push({ nombre: nombreMayus, ancho, anchoPlg, largo, largoPlg, cantidad, tot });
  localStorage.setItem('piezas', JSON.stringify(piezas));

  piezaInput.value = "";
  anchoInput.value = "";
  largoInput.value = "";
  cantidadInput.value = "";
  totalDisplay.innerText = "0.00";

  renderizar();
}

function editar(index) {
  const pieza = piezas[index];
  piezaInput.value = pieza.nombre;
  anchoInput.value = pieza.ancho;
  largoInput.value = pieza.largo;
  cantidadInput.value = pieza.cantidad;
  totalDisplay.innerText = pieza.tot;

  piezas.splice(index, 1);
  localStorage.setItem('piezas', JSON.stringify(piezas));
  renderizar();
}

function eliminar(index) {
  piezas.splice(index, 1);
  localStorage.setItem('piezas', JSON.stringify(piezas));
  renderizar();
}

document.getElementById('btnAgregar').addEventListener("click", agregar);

document.getElementById('btnBorrarTodo').addEventListener("click", () => {
  if (confirm("¿Estás seguro de que quieres borrar todos los datos?")) {
    piezas.length = 0;
    localStorage.setItem('piezas', JSON.stringify(piezas));
    renderizar();
  }
});

document.getElementById('btnDescargar').addEventListener("click", () => {
  if (piezas.length === 0) {
    alert("No hay piezas para descargar");
    return;
  }

  const ws_data = [["Pieza", "Ancho (mm)", "Ancho (plg)", "Largo (mm)", "Largo (plg)", "Cantidad", "Tot.p2"]];
  piezas.forEach(p => ws_data.push([p.nombre, p.ancho, p.anchoPlg, p.largo, p.largoPlg, p.cantidad, p.tot]));

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet(ws_data);

  XLSX.utils.book_append_sheet(wb, ws, "Piezas");
  XLSX.writeFile(wb, "FODEPICO_Piezas.xlsx");
});

document.getElementById('btnImprimir').addEventListener("click", () => {
  if (piezas.length === 0) {
    alert("No hay piezas para imprimir");
    return;
  }

  let printWindow = window.open('', '', 'height=600,width=800');
  printWindow.document.write('<html><head><title>Piezas Agregadas</title></head><body>');
  printWindow.document.write('<h1>Piezas Agregadas</h1><table border="1"><tr><th>Pieza</th><th>Ancho</th><th>Ancho (plg)</th><th>Largo</th><th>Largo (plg)</th><th>Cantidad</th><th>Tot.p2</th></tr>');
  
  piezas.forEach(pieza => {
    printWindow.document.write(`<tr>
      <td>${pieza.nombre}</td>
      <td>${pieza.ancho}</td>
      <td>${pieza.anchoPlg}</td>
      <td>${pieza.largo}</td>
      <td>${pieza.largoPlg}</td>
      <td>${pieza.cantidad}</td>
      <td>${pieza.tot}</td>
    </tr>`);
  });

  printWindow.document.write('</table></body></html>');
  printWindow.document.close();
  printWindow.print();
});

renderizar();
</script>

</body>
</html>
