<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Feliz Año Nuevo</title>
  <style>
    :root{
      --bg1:#050611; --bg2:#0b1230;
      --glass:rgba(255,255,255,.10);
      --stroke:rgba(255,255,255,.16);
      --text:rgba(255,255,255,.95);
      --muted:rgba(255,255,255,.74);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; color:var(--text);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(900px 520px at 10% 10%, rgba(34,211,238,.22), transparent 60%),
        radial-gradient(900px 520px at 90% 25%, rgba(236,72,153,.22), transparent 60%),
        radial-gradient(900px 520px at 50% 95%, rgba(124,58,237,.22), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      overflow:hidden;
    }

    /* Estrellas + brillo */
    .stars, .stars:before, .stars:after{
      position:absolute; inset:-240px; content:"";
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 120px 120px;
      opacity:.20;
      animation: drift 40s linear infinite;
      pointer-events:none;
      filter: drop-shadow(0 0 6px rgba(255,255,255,.18));
    }
    .stars:before{ background-size: 170px 170px; opacity:.14; animation-duration: 60s; }
    .stars:after { background-size: 90px 90px;  opacity:.10; animation-duration: 85s; }
    @keyframes drift { from{ transform: translateY(0);} to{ transform: translateY(220px);} }

    .wrap{
      min-height:100vh; display:grid; place-items:center;
      padding: 18px;
    }

    .card{
      width:min(720px, 100%);
      border-radius: 28px;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
      box-shadow: 0 30px 90px rgba(0,0,0,.48);
      overflow:hidden;
      position:relative;
    }
    .card:before{
      content:""; position:absolute; inset:-2px;
      background:
        radial-gradient(700px 350px at 30% 0%, rgba(34,211,238,.30), transparent 60%),
        radial-gradient(700px 350px at 70% 5%, rgba(236,72,153,.28), transparent 60%),
        radial-gradient(820px 420px at 50% 105%, rgba(124,58,237,.30), transparent 60%);
      filter: blur(18px);
      opacity:.95;
      pointer-events:none;
    }

    /* Fuegos/Confetti canvas */
    #fx{ position:absolute; inset:0; pointer-events:none; }

    .content{ position:relative; padding: 26px 18px 18px; text-align:center; }
    .pill{
      display:inline-flex; gap:10px; align-items:center;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      backdrop-filter: blur(10px);
      font-size: 13px;
    }
    .spark{
      width:10px; height:10px; border-radius:999px;
      background: rgba(34,211,238,.95);
      box-shadow: 0 0 18px rgba(34,211,238,.55);
    }

    h1{
      margin: 14px 0 8px;
      font-size: clamp(34px, 7.5vw, 56px);
      line-height: 1.05;
      letter-spacing: .2px;
      text-shadow: 0 0 28px rgba(124,58,237,.45);
    }
    .year{
      display:inline-block;
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      font-weight: 800;
    }
    .subtitle{
      margin: 0 auto 14px;
      max-width: 65ch;
      color: var(--muted);
      font-size: clamp(15px, 4vw, 18px);
    }

    /* Contador estilo “tarjeta grande” para celular */
    .countWrap{
      margin: 14px 0 12px;
      display:grid;
      gap: 10px;
      grid-template-columns: repeat(4, minmax(0,1fr));
    }
    .box{
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      padding: 12px 10px;
      backdrop-filter: blur(12px);
    }
    .num{
      font-size: clamp(30px, 9vw, 44px);
      font-weight: 900;
      letter-spacing: .5px;
    }
    .lbl{
      margin-top: 4px;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(255,255,255,.68);
    }

    .actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top: 10px; }
    button{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
    }
    button:active{ transform: scale(.98); }
    button.primary{
      background: linear-gradient(90deg, rgba(34,211,238,.22), rgba(236,72,153,.20), rgba(124,58,237,.22));
      border-color: rgba(34,211,238,.35);
    }

    .footer{
      position:relative;
      padding: 0 16px 16px;
      text-align:center;
      font-size: 12.5px;
      color: rgba(255,255,255,.60);
    }

    /* Mejor en pantallas pequeñas */
    @media (max-width: 420px){
      .countWrap{ grid-template-columns: repeat(2, minmax(0,1fr)); }
      .content{ padding: 22px 14px 14px; }
    }
  </style>
</head>

<body>
  <div class="stars"></div>

  <div class="wrap">
    <div class="card">
      <canvas id="fx"></canvas>

      <div class="content">
        <div class="pill"><span class="spark"></span><span id="status">Cuenta regresiva para medianoche…</span></div>

        <h1>¡Feliz Año Nuevo <span class="year" id="yearTxt"></span>! 🎆</h1>

        <div class="subtitle" id="msg">
          Que este nuevo año te traiga salud, paz, amor y prosperidad. ✨
        </div>

        <div class="countWrap" aria-label="Contador">
          <div class="box"><div class="num" id="d">00</div><div class="lbl">Días</div></div>
          <div class="box"><div class="num" id="h">00</div><div class="lbl">Horas</div></div>
          <div class="box"><div class="num" id="m">00</div><div class="lbl">Min</div></div>
          <div class="box"><div class="num" id="s">00</div><div class="lbl">Seg</div></div>
        </div>

        <div class="actions">
          <button class="primary" id="btnTest">Probar celebración 🎉</button>
          <button id="btnFullscreen">Pantalla completa ⛶</button>
        </div>
      </div>

      <div class="footer">Zona horaria usada: <b>America/Lima</b> (Perú)</div>
    </div>
  </div>

  <script>
    // ===== PERSONALIZA AQUÍ =====
    const PARA = "";            // Ej: "Para: Familia Urrutia"
    const MENSAJE_EXTRA = "";   // Ej: "Gracias por acompañarnos este año ❤️"
    const timeZone = "America/Lima";

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    // Ahora en hora Perú (sin depender del reloj del navegador en otra TZ)
    function nowInTZ() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone,
        year:"numeric", month:"2-digit", day:"2-digit",
        hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false
      }).formatToParts(new Date());

      const get = (t) => parts.find(p => p.type === t).value;
      const y = +get("year"), mo = +get("month"), da = +get("day");
      const hh = +get("hour"), mm = +get("minute"), ss = +get("second");
      return new Date(y, mo-1, da, hh, mm, ss);
    }

    function nextMidnight() {
      const n = nowInTZ();
      const t = new Date(n);
      t.setDate(t.getDate() + 1);
      t.setHours(0,0,0,0);
      return t;
    }

    // ===== EFECTO CONFETTI (más intenso) =====
    const canvas = $("fx");
    const ctx = canvas.getContext("2d");
    let W=0, H=0, pieces=[], anim=null;

    function resize() {
      const r = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = Math.floor(r.width);
      H = canvas.height = Math.floor(r.height);
    }
    window.addEventListener("resize", resize);

    function burst(count=260) {
      pieces = Array.from({length: count}, () => ({
        x: Math.random()*W,
        y: H + 30 + Math.random()*100,
        r: 4 + Math.random()*7,
        vy: -(4 + Math.random()*7),
        vx: -2.5 + Math.random()*5,
        g: 0.12 + Math.random()*0.08,
        a: Math.random()*Math.PI*2,
        va: -0.20 + Math.random()*0.40,
        life: 240 + Math.random()*220
      }));
    }

    function draw() {
      ctx.clearRect(0,0,W,H);
      for (const p of pieces) {
        p.vy += p.g;
        p.x += p.vx;
        p.y += p.vy;
        p.a += p.va;
        p.life -= 1;

        const hue = (p.x/W)*360;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.a);
        ctx.fillStyle = `hsla(${hue}, 95%, 70%, 0.95)`;
        ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r);
        ctx.restore();
      }
      pieces = pieces.filter(p => p.life > 0 && p.y < H + 80);
      if (pieces.length > 0) anim = requestAnimationFrame(draw);
    }

    function celebrate(auto=false) {
      cancelAnimationFrame(anim);
      resize();
      burst(300);
      draw();

      // Vibración (solo funciona en algunos celulares/navegadores)
      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);

      // Si es automático por medianoche, cambia el mensaje
      if (auto) {
        $("msg").innerHTML = (PARA ? `<b>${PARA}</b><br>` : "") +
          "¡Feliz Año Nuevo! 🎇<br>Que este año sea increíble para ti. ✨" +
          (MENSAJE_EXTRA ? `<br><br>${MENSAJE_EXTRA}` : "");
      }
    }

    // ===== UI =====
    function setPersonal() {
      const y = nowInTZ().getFullYear() + 1;
      $("yearTxt").textContent = y;
      if (PARA || MENSAJE_EXTRA) {
        $("msg").innerHTML =
          (PARA ? `<b>${PARA}</b><br>` : "") +
          "Que este nuevo año te traiga salud, paz, amor y prosperidad. ✨" +
          (MENSAJE_EXTRA ? `<br><br>${MENSAJE_EXTRA}` : "");
      }
    }

    let alreadyCelebrated = false;

    function tick() {
      const n = nowInTZ();
      const t = nextMidnight();
      const diff = t - n;

      if (diff <= 0) {
        if (!alreadyCelebrated) {
          alreadyCelebrated = true;
          $("status").textContent = "¡Ya es medianoche! 🎉";
          $("d").textContent = "00"; $("h").textContent = "00";
          $("m").textContent = "00"; $("s").textContent = "00";
          celebrate(true); // AUTO cuando llega medianoche
        }
        return;
      }

      $("status").textContent = "Cuenta regresiva para medianoche…";

      const totalSec = Math.floor(diff/1000);
      const days = Math.floor(totalSec/86400);
      const hours = Math.floor((totalSec%86400)/3600);
      const mins = Math.floor((totalSec%3600)/60);
      const secs = totalSec%60;

      $("d").textContent = pad2(days);
      $("h").textContent = pad2(hours);
      $("m").textContent = pad2(mins);
      $("s").textContent = pad2(secs);
    }

    $("btnTest").addEventListener("click", () => celebrate(false));
    $("btnFullscreen").addEventListener("click", async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch (e) {}
    });

    setPersonal();
    resize();
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
